<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast - Café Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-2xl font-bold text-gray-800">Café Inventory</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/dashboard.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="/bahan.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Bahan Baku
                        </a>
                        <a href="/menu.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Menu & Resep
                        </a>
                        <a href="/penjualan.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Penjualan
                        </a>
                        <a href="/forecast.html" class="border-b-2 border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Forecast
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="logoutBtn" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-sign-out-alt mr-2"></i>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Alert Messages -->
        <div id="alertSuccess" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4">
            <span class="block sm:inline"></span>
        </div>
        <div id="alertError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
            <span class="block sm:inline"></span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Forecast Settings -->
            <div class="lg:col-span-1">
                <div class="bg-white shadow rounded-lg p-6">
                    <h2 class="text-lg font-semibold mb-4">Pengaturan Forecast</h2>
                    <form id="forecastSettingsForm">
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="bahanSelect">
                                Bahan
                            </label>
                            <select id="bahanSelect" name="id_bahan" 
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                required>
                                <option value="">Pilih Bahan</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="minStok">
                                Minimum Stok
                            </label>
                            <input type="number" id="minStok" name="min_stok" 
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                required min="0" step="0.01">
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="leadTime">
                                Lead Time (hari)
                            </label>
                            <input type="number" id="leadTime" name="lead_time" 
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                required min="1">
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="safetyStock">
                                Safety Stock
                            </label>
                            <input type="number" id="safetyStock" name="safety_stock" 
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                required min="0" step="0.01">
                        </div>
                        <div class="flex justify-end">
                            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                                <i class="fas fa-save mr-2"></i>
                                Simpan
                            </button>
                        </div>
                    </form>
                </div>

                <div class="mt-6 bg-white shadow rounded-lg p-6">
                    <h2 class="text-lg font-semibold mb-4">Generate Forecast</h2>
                    <button id="generateForecastBtn" class="w-full bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        <i class="fas fa-sync mr-2"></i>
                        Generate Forecast
                    </button>
                </div>
            </div>

            <!-- Forecast Results -->
            <div class="lg:col-span-2">
                <!-- Usage Trend Chart -->
                <div class="bg-white shadow rounded-lg p-6 mb-6">
                    <h2 class="text-lg font-semibold mb-4">Trend Penggunaan</h2>
                    <canvas id="usageChart"></canvas>
                </div>

                <!-- Purchase Recommendations -->
                <div class="bg-white shadow rounded-lg p-6">
                    <h2 class="text-lg font-semibold mb-4">Rekomendasi Pembelian</h2>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Bahan</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stok Saat Ini</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Prediksi Penggunaan</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rekomendasi</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Confidence</th>
                                </tr>
                            </thead>
                            <tbody id="recommendationsTableBody" class="bg-white divide-y divide-gray-200">
                                <!-- Recommendations will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        }

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });

        // Show alert
        function showAlert(message, isSuccess = true) {
            const alertSuccess = document.getElementById('alertSuccess');
            const alertError = document.getElementById('alertError');
            
            if (isSuccess) {
                alertSuccess.textContent = message;
                alertSuccess.classList.remove('hidden');
                setTimeout(() => alertSuccess.classList.add('hidden'), 3000);
            } else {
                alertError.textContent = message;
                alertError.classList.remove('hidden');
                setTimeout(() => alertError.classList.add('hidden'), 3000);
            }
        }

        // Load bahan options
        async function loadBahanOptions() {
            try {
                const response = await fetch('/api/bahan/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const bahanSelect = document.getElementById('bahanSelect');
                bahanSelect.innerHTML = '<option value="">Pilih Bahan</option>' +
                    data.data.map(bahan => `
                        <option value="${bahan.id_bahan}">${bahan.nama_bahan}</option>
                    `).join('');
            } catch (error) {
                showAlert('Error loading bahan options: ' + error.message, false);
            }
        }

        // Load forecast settings
        async function loadForecastSettings(id_bahan) {
            try {
                const response = await fetch('/api/forecast/settings', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const settings = data.data.find(s => s.id_bahan === parseInt(id_bahan));
                if (settings) {
                    document.getElementById('minStok').value = settings.min_stok;
                    document.getElementById('leadTime').value = settings.lead_time;
                    document.getElementById('safetyStock').value = settings.safety_stock;
                }
            } catch (error) {
                showAlert('Error loading forecast settings: ' + error.message, false);
            }
        }

        // Load recommendations
        async function loadRecommendations() {
            try {
                const response = await fetch('/api/forecast/recommendations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const tableBody = document.getElementById('recommendationsTableBody');
                tableBody.innerHTML = data.data.map(item => `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">${item.nama_bahan}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${item.current_stock}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${item.predicted_usage.toFixed(2)}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            ${item.recommended_purchase > 0 
                                ? `<span class="px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">
                                    Beli ${item.recommended_purchase.toFixed(2)}
                                   </span>`
                                : `<span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">
                                    Stok Cukup
                                   </span>`
                            }
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="w-16 bg-gray-200 rounded-full h-2 mr-2">
                                    <div class="bg-blue-600 rounded-full h-2" 
                                        style="width: ${(item.confidence_level * 100)}%"></div>
                                </div>
                                <span class="text-sm text-gray-600">
                                    ${(item.confidence_level * 100).toFixed(1)}%
                                </span>
                            </div>
                        </td>
                    </tr>
                `).join('');

                // Update usage chart
                if (data.data.length > 0) {
                    updateUsageChart(data.data[0].id_bahan);
                }
            } catch (error) {
                showAlert('Error loading recommendations: ' + error.message, false);
            }
        }

        // Update usage chart
        async function updateUsageChart(id_bahan) {
            try {
                const response = await fetch(`/api/stock/usage-stats?id_bahan=${id_bahan}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const ctx = document.getElementById('usageChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.data.map(d => d.date),
                        datasets: [{
                            label: 'Penggunaan',
                            data: data.data.map(d => d.total_used),
                            borderColor: 'rgb(59, 130, 246)',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } catch (error) {
                showAlert('Error updating chart: ' + error.message, false);
            }
        }

        // Event Handlers
        document.getElementById('bahanSelect').addEventListener('change', (e) => {
            if (e.target.value) {
                loadForecastSettings(e.target.value);
            }
        });

        document.getElementById('forecastSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                id_bahan: document.getElementById('bahanSelect').value,
                min_stok: parseFloat(document.getElementById('minStok').value),
                lead_time: parseInt(document.getElementById('leadTime').value),
                safety_stock: parseFloat(document.getElementById('safetyStock').value)
            };

            try {
                const response = await fetch('/api/forecast/settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showAlert('Pengaturan forecast berhasil disimpan');
                } else {
                    showAlert(result.error, false);
                }
            } catch (error) {
                showAlert('Error: ' + error.message, false);
            }
        });

        document.getElementById('generateForecastBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/forecast/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const result = await response.json();
                
                if (response.ok) {
                    showAlert('Forecast berhasil digenerate');
                    loadRecommendations();
                } else {
                    showAlert(result.error, false);
                }
            } catch (error) {
                showAlert('Error: ' + error.message, false);
            }
        });

        // Load initial data
        loadBahanOptions();
        loadRecommendations();
    </script>
</body>
</html>
